<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numerology Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

    <main class="app">
      <header class="hero reveal">
        <p class="eyebrow">NUMEROLOGY</p>
        <h1>Get Your Mulank & Bhagyank Insights</h1>
        <p class="subtitle">
          Enter your date of birth or your name, or directly check a mulank or bhagyank number.
        </p>
      </header>

      <section class="panel reveal reveal-delay-1">
        <div class="mode-switch" role="tablist" aria-label="Input Mode">
          <button class="mode-btn is-active" data-mode="dob" role="tab" aria-selected="true">DOB</button>
          <button class="mode-btn" data-mode="name" role="tab" aria-selected="false">Name</button>
          <button class="mode-btn" data-mode="mulank" role="tab" aria-selected="false">Mulank</button>
          <button class="mode-btn" data-mode="bhagyank" role="tab" aria-selected="false">Bhagyank</button>
        </div>

        <form id="numerology-form" class="form-grid">
          <label id="input-label" for="input-value">Date of Birth (DD-MM-YYYY)</label>
          <input id="input-value" name="value" type="text" placeholder="24-08-1993" autocomplete="off" required />
          <button type="submit" class="cta">Show Details</button>
        </form>

        <p id="error" class="error" role="alert" aria-live="polite"></p>
      </section>

      <section id="result" class="result reveal reveal-delay-2" aria-live="polite"></section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
