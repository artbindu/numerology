<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Numerology</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>
    <div class="bg-dots" aria-hidden="true"></div>

    <main class="app">
      <header class="top-nav">
        <div class="top-nav-left">
          <button
            id="sidebar-toggle"
            class="nav-icon-btn"
            type="button"
            aria-controls="quick-sidebar"
            aria-expanded="true"
            aria-label="Toggle sidebar"
          >
            <span class="material-icons" aria-hidden="true">menu</span>
          </button>
          <div class="top-brand" aria-label="App brand">
            <span class="top-logo" aria-hidden="true">
              <img class="top-logo-img" src="./logo.png" alt="" />
            </span>
            <div>
              <p class="top-brand-title">Numerology Studio</p>
              <p class="top-brand-sub">Dashboard</p>
            </div>
          </div>
        </div>

        <label class="top-search" aria-label="Search">
          <span class="material-icons" aria-hidden="true">search</span>
          <input type="search" placeholder="Search insights, colors, history" />
        </label>

        <div class="top-actions">
          <button class="nav-icon-btn" type="button" aria-label="Notifications">
            <span class="material-icons" aria-hidden="true">notifications</span>
          </button>
          <button class="top-user" type="button" aria-label="User profile">NS</button>
        </div>
      </header>

      <div class="workspace reveal reveal-delay-2">
        <button
          id="sidebar-backdrop"
          class="sidebar-backdrop"
          type="button"
          aria-label="Close sidebar"
        ></button>

        <aside id="quick-sidebar" class="sidebar" aria-label="Sidebar navigation">
          <article class="side-card side-card-merged">
            <nav class="side-nav" aria-label="Main navigation">
              <button class="side-option sidebar-mode-btn is-active" data-mode="dob" aria-pressed="true">
                <span class="material-icons side-icon" aria-hidden="true">calendar_month</span>
                <span class="side-option-content">
                  <span class="side-option-title">DOB Insight</span>
                  <span class="side-option-meta">Birth date based profile</span>
                </span>
              </button>
              <button class="side-option sidebar-mode-btn" data-mode="name" aria-pressed="false">
                <span class="material-icons side-icon" aria-hidden="true">badge</span>
                <span class="side-option-content">
                  <span class="side-option-title">Name Insight</span>
                  <span class="side-option-meta">Name number and meaning</span>
                </span>
              </button>
              <button class="side-option sidebar-mode-btn" data-mode="mulank" aria-pressed="false">
                <span class="material-icons side-icon" aria-hidden="true">filter_1</span>
                <span class="side-option-content">
                  <span class="side-option-title">Mulank Lookup</span>
                  <span class="side-option-meta">Single number profile</span>
                </span>
              </button>
              <button class="side-option sidebar-mode-btn" data-mode="bhagyank" aria-pressed="false">
                <span class="material-icons side-icon" aria-hidden="true">filter_9_plus</span>
                <span class="side-option-content">
                  <span class="side-option-title">Bhagyank Lookup</span>
                  <span class="side-option-meta">Destiny number profile</span>
                </span>
              </button>
              <button id="show-color-guide-btn" class="side-option side-link" type="button">
                <span class="material-icons side-icon" aria-hidden="true">palette</span>
                <span class="side-option-content">
                  <span class="side-option-title">Color Meaning Guide</span>
                  <span class="side-option-meta">Color meaning index</span>
                </span>
              </button>
            </nav>
              <div class="side-about" aria-label="About this app">
                <div class="side-about-row">
                  <span class="side-about-label">App</span>
                  <span id="app-version" class="side-about-value">2.1.0</span>
                </div>
              </div>
          </article>
        </aside>

        <div class="content-stack">
          <section class="form-shell">
            <form id="numerology-form" class="form-grid">
              <label id="input-label" for="input-value">Date of Birth (DD-MM-YYYY)</label>
              <div class="input-wrap">
                <span class="material-icons" aria-hidden="true">calendar_month</span>
                <input
                  id="input-value"
                  name="value"
                  type="text"
                  placeholder="24-08-1993"
                  autocomplete="off"
                  required
                />
              </div>
              <button type="submit" class="cta">Generate Insight</button>
            </form>

            <p id="error" class="error" role="alert" aria-live="polite"></p>
          </section>

          <section id="result" class="result" aria-live="polite"></section>
          <section id="color-guide" class="result result-max" aria-live="polite" hidden></section>
        </div>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
